services:
  chronolapse:
    build:
      context: .
      dockerfile: Dockerfile
    image: chronolapse:latest
    container_name: chronolapse
    environment:
      - DISPLAY=${DISPLAY}
    volumes:
      # Mount X11 socket for GUI display
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # Mount current directory for configuration persistence
      - ./:/app/data
      # Mount screenshot and webcam directories
      - ./screenshots:/app/screenshots
      - ./webcam:/app/webcam
      # Mount video output directory
      - ./videos:/app/videos
    working_dir: /app/data
    network_mode: host
    devices:
      # Grant access to webcam (if available)
      - /dev/video0:/dev/video0
    privileged: false
    stdin_open: true
    tty: true
    restart: unless-stopped
